<!DOCTYPE html>

<html lang="es">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1" name="viewport"/>
<title>Aitana Briet | Marketing &amp; Digital Strategy</title>
<meta content="Portfolio de Aitana Briet — Marketing Digital, Estrategia, Analítica, E-commerce y proyectos digitales." name="description"/>
<meta content="Aitana Briet | Marketing &amp; Digital Strategy" property="og:title"/>
<meta content="Portfolio de Aitana Briet — Marketing Digital, Estrategia, Analítica, E-commerce y proyectos digitales." property="og:description"/>
<meta content="website" property="og:type"/>
<link href="style.css" rel="stylesheet"/>
</head>
<body>
<!--
  TEXTOS, CIFRAS Y ENLACES: se editan en script.js (bloque "CONTENIDO EDITABLE DEL PORTFOLIO").
  Este archivo solo contiene la estructura. Los huecos de imágenes y vídeos indican qué archivo va en cada sitio.
-->
<!-- ============ NAV (discreta, sticky) ============ -->
<header class="nav">
<a class="logo" data-c="site.name" href="#hero"></a>
<nav id="menu">
<a data-c="nav.about" href="#about"></a>
<a data-c="nav.projects" href="#projects"></a>
<a data-c="nav.toolkit" href="#toolkit"></a>
<a data-c="nav.contact" href="#contact"></a>
</nav>
<div class="right">
<div class="lang"><button class="on" data-lang="es">ES</button><span>/</span><button data-lang="en">EN</button></div>
<button aria-expanded="false" aria-label="Menu" class="burger">☰</button>
</div>
</header>
<main>
<!-- ============ HERO: 2 columnas (texto chocolate | foto sobre crema) ============ -->
<section class="hero" id="hero">
<div class="hero-txt">
<p class="label" data-c="site.name"></p>
<p class="hero-name"><em data-c="hero.name"></em></p>
<h1 data-c="hero.title"></h1>
</div>
<div class="hero-photo">
<!-- PERSONAL PHOTO: sustituye assets/images/aitana.jpg (vertical 4:5) -->
<figure class="ph portrait" data-label="PERSONAL PHOTO · assets/images/aitana.jpg">
<img alt="Aitana Briet" onerror="this.remove()" src="assets/images/aitana.jpg"/>
</figure>
</div>
</section>
<div class="strip wrap">
<p class="lead" data-c="hero.lead"></p>
<p class="label" data-c="hero.areas"></p>
<div class="btns">
<a class="btn btn-dark" data-c="hero.buttonProjects" href="#projects"></a>
<a class="btn btn-line" data-c="hero.buttonContact" href="#contact"></a>
</div>
</div>
<!-- ============ ABOUT: título | texto en 2 columnas | tags a ancho completo ============ -->
<section class="sec" id="about">
<div class="wrap about">
<h2 class="big reveal" data-c="about.title"></h2>
<div class="cols2">
<p data-c="about.p1"></p>
<p data-c="about.p2"></p>
<p data-c="about.p3"></p>
</div>
<ul class="tags full" data-c-list="about.tags"></ul>
</div>
</section>
<!-- ============ PROJECTS ============ -->
<section id="projects">
<div class="wrap sec-head">
<h2 class="big reveal" data-c="projects.title"></h2>
<p class="sub" data-c="projects.subtitle"></p>
</div>
<!-- ---------- 01 FLIPFLOW ---------- -->
<article class="p1 sec">
<div class="wrap">
<div class="top3">
<span class="pnum">01</span>
<div>
<p class="label" data-c="flipflow.category"></p>
<h3 class="ptitle" data-c="flipflow.title"></h3>
<p class="label" data-c="flipflow.subtitle"></p>
</div>
<div class="badge"><b data-c="flipflow.badgeTitle"></b><span data-c="flipflow.badgeDetail"></span></div>
</div>
<!-- FLIPFLOW PROJECT IMAGE: assets/images/flipflow/flipflow-01.jpg -->
<figure class="ph wide" data-label="FLIPFLOW PROJECT IMAGE · assets/images/flipflow/flipflow-01.jpg"><img alt="Flipflow Go-to-Market Plan" onerror="this.remove()" src="assets/images/flipflow/flipflow-01.jpg"/></figure>
<div class="cols2 info">
<p data-c="flipflow.description"></p>
<ul class="tags" data-c-list="flipflow.skills"></ul>
</div>
<div class="mgrid g4" data-metrics="flipflow.metrics">







<!-- LINK FLIPFLOW (nueva pestaña) -->
<div class="metric cta"><a class="btn btn-cream" data-c="flipflow.buttonLabel" data-href="flipflow.link" href="#" rel="noopener" target="_blank"></a></div>
</div>
</div>
</article>
<!-- ---------- 02 MUDEAPP ---------- -->
<article class="p2 sec">
<div class="wrap">
<div class="top2">
<div><span class="pnum dark">02</span><h3 class="ptitle" data-c="mudeapp.title"></h3></div>
<div>
<p class="label" data-c="mudeapp.category"></p>
<p class="label" data-c="mudeapp.subtitle"></p>
<p data-c="mudeapp.description"></p>
</div>
</div>
<div class="shots">
<!-- MUDEAPP SCREEN 01: assets/images/mudeapp/screen-01.jpg -->
<figure class="ph land big-shot" data-label="MUDEAPP SCREEN 01 · mudeapp/screen-01.jpg"><img alt="MudeApp pantalla 1" onerror="this.remove()" src="assets/images/mudeapp/screen-01.jpg"/></figure>
<!-- MUDEAPP SCREEN 02: assets/images/mudeapp/screen-02.jpg -->
<figure class="ph land" data-label="MUDEAPP SCREEN 02 · mudeapp/screen-02.jpg"><img alt="MudeApp pantalla 2" onerror="this.remove()" src="assets/images/mudeapp/screen-02.jpg"/></figure>
<!-- MUDEAPP SCREEN 03: assets/images/mudeapp/screen-03.jpg -->
<figure class="ph land" data-label="MUDEAPP SCREEN 03 · mudeapp/screen-03.jpg"><img alt="MudeApp pantalla 3" onerror="this.remove()" src="assets/images/mudeapp/screen-03.jpg"/></figure>
</div>
<div class="g3 info3">
<div>
<h4 class="sm" data-c="mudeapp.flowTitle"></h4>
<p><b data-c="mudeapp.problemLabel"></b><br/><span data-c="mudeapp.problemText"></span></p>
<p><b data-c="mudeapp.productLabel"></b><br/><span data-c="mudeapp.productText"></span></p>
<ul class="tags" data-c-list="mudeapp.features"></ul>
</div>
<div>
<h4 class="sm" data-c="mudeapp.roleTitle"></h4>
<ul class="tags" data-c-list="mudeapp.roles"></ul>
</div>
<div>
<h4 class="sm" data-c="mudeapp.approachTitle"></h4>
<p class="label" data-c="mudeapp.approach"></p>
<h4 class="sm" data-c="mudeapp.structureTitle"></h4>
<p class="label" data-c="mudeapp.structure"></p>
<h4 class="sm" data-c="mudeapp.toolsTitle"></h4>
<p class="label" data-c="mudeapp.tools"></p>
</div>
</div>
</div>
</article>
<!-- ---------- 03 BAR MONTE ---------- -->
<article class="p3">
<div class="wrap sec">
<div class="top2">
<div><span class="pnum dark">03</span><h3 class="ptitle" data-c="barMonte.title"></h3></div>
<div>
<p class="label" data-c="barMonte.category"></p>
<p class="label" data-c="barMonte.subtitle"></p>
<p data-c="barMonte.description"></p>
</div>
</div>
<!-- BLOQUE 01 · THE CHALLENGE -->
<h4 class="big2" data-c="barMonte.challengeTitle"></h4>
<div class="ba">
<div><p class="label" data-c="barMonte.beforeLabel"></p>
<!-- BAR MONTE BEFORE FEED: assets/images/bar-monte/before-feed.jpg -->
<figure class="ph tall" data-label="BEFORE FEED · bar-monte/before-feed.jpg"><img alt="Before feed" onerror="this.remove()" src="assets/images/bar-monte/before-feed.jpg"/></figure></div>
<div><p class="label" data-c="barMonte.afterLabel"></p>
<!-- BAR MONTE AFTER FEED: assets/images/bar-monte/after-feed.jpg -->
<figure class="ph tall" data-label="AFTER FEED · bar-monte/after-feed.jpg"><img alt="After feed" onerror="this.remove()" src="assets/images/bar-monte/after-feed.jpg"/></figure></div>
</div>
<!-- BLOQUE 02 · CONTENT STRATEGY -->
<div class="top2 gap-t">
<h4 class="big2" data-c="barMonte.contentTitle"></h4>
<p class="lead" data-c="barMonte.contentText"></p>
</div>
<!-- Cada hueco admite imagen content-0X.jpg o vídeo vertical content-0X.mp4 (con controles, sin autoplay) -->
<div class="gallery">
<!-- BAR MONTE CONTENT 01 -->
<figure class="ph reel" data-label="CONTENT 01"><video controls="" playsinline="" poster="assets/images/bar-monte/content-01.jpg" preload="metadata"><source src="assets/videos/bar-monte/content-01.mp4" type="video/mp4"/></video></figure>
<!-- BAR MONTE CONTENT 02 -->
<figure class="ph reel" data-label="CONTENT 02"><video controls="" playsinline="" poster="assets/images/bar-monte/content-02.jpg" preload="metadata"><source src="assets/videos/bar-monte/content-02.mp4" type="video/mp4"/></video></figure>
<!-- BAR MONTE CONTENT 03 -->
<figure class="ph reel" data-label="CONTENT 03"><video controls="" playsinline="" poster="assets/images/bar-monte/content-03.jpg" preload="metadata"><source src="assets/videos/bar-monte/content-03.mp4" type="video/mp4"/></video></figure>
<!-- BAR MONTE CONTENT 04 -->
<figure class="ph reel" data-label="CONTENT 04"><video controls="" playsinline="" poster="assets/images/bar-monte/content-04.jpg" preload="metadata"><source src="assets/videos/bar-monte/content-04.mp4" type="video/mp4"/></video></figure>
</div>
</div>
<!-- BLOQUE 03 · REAL RESULTS -->
<div class="results sec">
<div class="wrap">
<div class="top2">
<h4 class="big2 flush" data-c="barMonte.resultsTitle"></h4>
<p class="lead" data-c="barMonte.resultsText"></p>
</div>
<div class="mgrid g12" data-metrics="barMonte.metrics"></div>
<blockquote class="quote" data-c="barMonte.quote"></blockquote>
</div>
</div>
<div class="wrap sec">
<!-- BLOQUE 04 · META ADS CASE STUDY (clic = lightbox) -->
<h4 class="big2 flush" data-c="barMonte.metaAdsTitle"></h4>
<div class="ads">
<!-- META ADS CASE 01: bar-monte/meta-ads-01.jpg -->
<figure class="ph zoom" data-label="META ADS 01"><img alt="Meta Ads 1" onerror="this.remove()" src="assets/images/bar-monte/meta-ads-01.jpg"/></figure>
<!-- META ADS CASE 02: bar-monte/meta-ads-02.jpg -->
<figure class="ph zoom" data-label="META ADS 02"><img alt="Meta Ads 2" onerror="this.remove()" src="assets/images/bar-monte/meta-ads-02.jpg"/></figure>
<!-- META ADS CASE 03: bar-monte/meta-ads-03.jpg -->
<figure class="ph zoom" data-label="META ADS 03"><img alt="Meta Ads 3" onerror="this.remove()" src="assets/images/bar-monte/meta-ads-03.jpg"/></figure>
</div>
<!-- BLOQUE 05 · CONTENT PERFORMANCE: imagen | texto -->
<div class="perf">
<!-- PERFORMANCE CONTENT IMAGE: bar-monte/performance.jpg -->
<figure class="ph land zoom" data-label="PERFORMANCE · bar-monte/performance.jpg"><img alt="Content performance" onerror="this.remove()" src="assets/images/bar-monte/performance.jpg"/></figure>
<div>
<h4 class="big2 flush" data-c="barMonte.performanceTitle"></h4>
<p class="lead" data-c="barMonte.performanceText"></p>
</div>
</div>
</div>
</article>
</section>
<!-- ============ TOOLKIT: título | grid 3 columnas ============ -->
<section class="sec" id="toolkit">
<div class="wrap">
<h2 class="big reveal" data-c="toolkit.title"></h2>
<div class="g3 tk" data-groups="toolkit.groups"></div>
</div>
</section>
<!-- ============ WHAT I BRING: 4 columnas ============ -->
<section class="bring sec">
<div class="wrap">
<h2 class="big reveal" data-c="bring.title"></h2>
<div class="g4" data-items="bring.items"></div>
</div>
</section>
<!-- ============ CONTACT: 2 columnas ============ -->
<section class="contact sec" id="contact">
<div class="wrap top2">
<h2 class="big reveal" data-c="contact.title"></h2>
<div>
<p class="lead" data-c="contact.text"></p>
<div class="btns">
<!-- LINKEDIN URL: pega tu enlace en href -->
<!-- EMAIL (botón CONTACTAR): cambia tuemail@ejemplo.com -->
<a class="btn btn-dark" data-c="contact.buttonContact" data-mailto="contact.email" href="#"></a>
<!-- LINKEDIN URL: pega tu enlace en href -->
<a class="btn btn-line" data-c="contact.buttonLinkedin" data-href="contact.linkedin" href="#" rel="noopener" target="_blank"></a>
<!-- CV URL: sube tu CV a assets/cv.pdf o pega un enlace -->
<a class="btn btn-line" data-c="contact.buttonCv" data-href="contact.cv" href="#" rel="noopener" target="_blank"></a>
</div>
</div>
</div>
</section>
</main>
<footer class="footer">
<strong data-c="site.name"></strong>
<p data-c="site.tagline"></p>
<div class="lang"><button class="on" data-lang="es">ES</button><span>/</span><button data-lang="en">EN</button></div>
<p data-c="site.copyright"></p>
</footer>
<div class="lightbox" hidden="" id="lightbox"><button aria-label="X" class="lb-x">X</button><img alt=""/></div>
<script src="script.js"></script>
</body>
</html>
